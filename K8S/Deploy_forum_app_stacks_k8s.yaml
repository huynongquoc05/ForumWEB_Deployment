# ======================================================================
# 1. REDIS STACK (DEPLOYMENT + SERVICE)
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
# ======================================================================
# 2. FLASK FORUM APP STACK (DEPLOYMENT + SERVICE)
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-forum
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flask-forum
  template:
    metadata:
      labels:
        app: flask-forum
    spec:
      containers:
        - name: flask-forum
          image: cb5555/forumweb-web:latest
          ports:
            - containerPort: 8005
          env:
            - name: REDIS_HOST
              value: "redis"
          resources:
            requests:
              memory: "200Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "1000m" # Đã sửa từ 1000000m về 1 CPU Core thực tế
---
apiVersion: v1
kind: Service
metadata:
  name: flask-forum-service
spec:
  type: ClusterIP # Sử dụng ClusterIP để bảo mật nội bộ, traffic từ ngoài sẽ đi qua Ingress
  selector:
    app: flask-forum
  ports:
    - protocol: TCP
      port: 8005
      targetPort: 8005

---
# ======================================================================
# 3. INGRESS ROUTING (CATCH-ALL FOR EXTERNAL LB)
# ======================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forum-ingress
spec:
  ingressClassName: nginx
  rules:
    - http: # Bỏ hoàn toàn thuộc tính 'host' để nhận mọi request chuyển tiếp từ External LB
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-forum-service
                port:
                  number: 8005

---
# ======================================================================
# 4. HORIZONTAL POD AUTOSCALER (HPA)
# ======================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-forum-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-forum
  minReplicas: 4
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue  # Đã sửa thành định dạng đo lường giá trị tuyệt đối
          averageValue: 150m  # Tự động nhân bản khi tải trung bình của Pod chạm mốc 150m
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # Chờ 1 phút ổn định sau khi tải giảm trước khi hạ cấp Pod
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15          # Thu hồi tài nguyên nhanh chóng
    scaleUp:
      stabilizationWindowSeconds: 0  # Đẻ Pod ngay lập tức khi chịu tải lớn đột biến từ k6
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15