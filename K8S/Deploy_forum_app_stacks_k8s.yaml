# ======================================================================
# 1. REDIS STACK (DEPLOYMENT + SERVICE)
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
# ======================================================================
# 2. FLASK FORUM APP STACK (DEPLOYMENT + SERVICE)
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-forum
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flask-forum
  template:
    metadata:
      labels:
        app: flask-forum
    spec:
      containers:
        - name: flask-forum
          image: ghcr.io/huynongquoc05/forumweb_deployment:latest
          ports:
            - containerPort: 8005
          envFrom: # <--- BẬT BƠM MÔI TRƯỜNG TỰ ĐỘNG TẠI ĐÂY
            - secretRef:
                name: forum-env-secret # Tự bốc các biến DB_SERVER, DB_USER... ném vào container
          env:
            - name: REDIS_HOST # Giữ biến này thủ công để ghi đè hoặc chỉ định rõ service nội bộ
              value: "redis"
          resources:
            requests:
              memory: "200Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: flask-forum-service
spec:
  type: ClusterIP
  selector:
    app: flask-forum
  ports:
    - protocol: TCP
      port: 8005
      targetPort: 8005

---
# ======================================================================
# 3. INGRESS ROUTING (CATCH-ALL FOR EXTERNAL LB)
# ======================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forum-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-forum-service
                port:
                  number: 8005

---
# ======================================================================
# 4. HORIZONTAL POD AUTOSCALER (HPA)
# ======================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-forum-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-forum
  minReplicas: 4
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: 150m
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15