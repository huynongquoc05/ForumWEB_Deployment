
# ======================================================================
# 1. REDIS STACK (DEPLOYMENT + SERVICE)
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
# ======================================================================
# 2. LOCAL SQL SERVER STACK (DEPLOYMENT + SERVICE) - SỬA LỖI HẠ TẦNG CLOUD
# ======================================================================
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
spec:
  selector:
    app: sqlserver
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
---
# ... (phần trên giữ nguyên)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      # --- BỔ SUNG ĐOẠN INIT CONTAINER NÀY ---
      initContainers:
        - name: fix-volume-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 10001:0 /var/opt/mssql"]
          volumeMounts:
            - name: sql-data
              mountPath: /var/opt/mssql
      # ----------------------------------------
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2019-latest
          ports:
            - containerPort: 1433
          envFrom:
            - secretRef:
                name: forum-env-secret
          resources: # Bổ sung giới hạn an toàn cho SQL nội bộ
            requests:
              memory: "1500Mi"
              cpu: "500m"
            limits:
              memory: "2500Mi"
              cpu: "1000m"
          volumeMounts:
            - name: sql-data
              mountPath: /var/opt/mssql
            - name: sql-script-volume
              mountPath: /var/opt/mssql/scripts/ForumWEB.sql # Sửa thành đường dẫn tuyệt đối
              subPath: ForumWEB.sql
      volumes:
        - name: sql-data
          hostPath: # Thay PVC bằng HostPath để lưu trực tiếp vào đĩa SSD của máy ảo Worker 2
            path: /mnt/sqlserver-data
            type: DirectoryOrCreate
        - name: sql-script-volume
          configMap:
            name: forum-sql-script

---
# ======================================================================
# 3. FLASK FORUM APP STACK (DEPLOYMENT + SERVICE)
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-forum
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flask-forum
  template:
    metadata:
      labels:
        app: flask-forum
    spec:
      containers:
        - image: ghcr.io/huynongquoc05/forumweb_deployment:latest
          name: flask-forum
          ports:
            - containerPort: 8005
          envFrom:
            - secretRef:
                name: forum-env-secret
          resources:
            requests:
              memory: "200Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: flask-forum-service
  labels:
    monitor: forum-svc
spec:
  type: ClusterIP # Chuyển về ClusterIP để Ingress độc quyền gánh traffic, tăng bảo mật
  selector:
    app: flask-forum
  ports:
    - protocol: TCP
      name: main
      port: 8005
      targetPort: 8005

---
# ======================================================================
# 4. INGRESS ROUTING (CATCH-ALL FOR EXTERNAL LB) - SỬA LỖI CÚ PHÁP
# ======================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forum-ingress
spec:
  ingressClassName: nginx
  rules:
    - http: # Đã sửa lại cú pháp mảng và khoảng thụt dòng chuẩn quy định K8s
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-forum-service
                port:
                  number: 8005

---
# ======================================================================
# 5. HORIZONTAL POD AUTOSCALER (HPA)
# ======================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-forum-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-forum
  minReplicas: 4
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 150
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forum-sm
  namespace: default
  labels:
     release: monitoring
spec:
  selector:
    matchLabels:
      monitor: forum-svc
  endpoints:
  - port: main
    path: /metrics
    interval: 15s