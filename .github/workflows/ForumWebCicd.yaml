name: ForumWebCicd

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'         # Bỏ qua tất cả các file Markdown (bao gồm README.md)
      - 'assets/**'     # Bỏ qua toàn bộ thay đổi trong thư mục assets
      - 'images/**'     # Bỏ qua thư mục hình ảnh (nếu có)
      - 'docs/**'       # Bỏ qua tài liệu dự án (nếu có)

# Job 1: Check code
jobs:
  check_code:
    runs-on: ubuntu-latest

    steps:
      - name: Kéo mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'

      - name: cài flake8
        run: pip install flake8

      - name: Quét mã nguồn bằng Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # Job 2: Build, test and push image to registry
  build_test_and_push_image:
    needs: check_code
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Kéo mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Kiểm tra phiên bản Docker & Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Giải mã file bảo mật từ Base64
        run: echo "${{ secrets.ENV_B64 }}" | base64 --decode > .env

      - name: tạo mạng Docker
        run: |
          docker network create backend_network || true
          docker network create frontend_network || true
          docker network create monitoring_network || true

      - name: Build và khởi chạy hệ thống bằng Docker Compose
        run: |
          docker compose --env-file ./.env -f Docker/docker-compose.yaml up -d --build --scale web=2
          docker compose -f Docker/monitoring-compose.yaml up -d

      - name: Chờ hệ thống khởi động (30 giây)
        run: sleep 30

      - name: fill sql data
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
        run: docker exec forum_sql_server /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_PASS" -C -i /ForumWEB.sql

      - name: Kiểm tra trạng thái các Container
        run: |
          docker compose -f Docker/docker-compose.yaml ps
          docker compose -f Docker/monitoring-compose.yaml ps

      - name: Kiểm tra kết nối Web (Ping thử Nginx)
        run: curl -f http://localhost || exit 1

      - name: In ra Log của Flask App (để debug nếu cần)
        # Phải trỏ đúng file chứa service 'web'
        run: docker compose -f Docker/docker-compose.yaml logs web

      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push image
        run: docker push ghcr.io/huynongquoc05/forumweb_deployment:latest

      - name: Dọn dẹp (Tắt container)
        run: |
          docker compose -f Docker/docker-compose.yaml down
          docker compose -f Docker/monitoring-compose.yaml down

