
services:
  redis:
    image: redis:latest
#    container_name: cache_redis
    networks:
        - backend_network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
#    container_name: sql_server
    container_name: forum_sql_server
    env_file:
      - ../.env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
#    ports:
#      - 1433:1433
    networks:
        - backend_network
    volumes:
        - sql_data:/var/opt/mssql
        - ../ForumWEB.sql:/ForumWEB.sql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s   # thêm dòng này, SQL Server khởi động chậm

  nginx:
    image: nginx:latest
#    container_name: nginx_server
    ports:
      - "80:80"

    volumes:
      - ./Nginx.conf:/etc/nginx/conf.d/default.conf
      - ../static:/app/static
    depends_on:
      - web
    networks:
      - frontend_network



  web:
    build: ..

#    ports:
#      - "8005:8005"  comment lại
    env_file:
      - ../.env
    image: ghcr.io/huynongquoc05/forumweb_deployment:latest
    environment:
      - DB_SERVER=sqlserver
      - DB_NAME=${DB_NAME}
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    networks:
        - backend_network
        - frontend_network
    volumes:

#      - ..:/app
      - ../static:/app/static
      - ../db_helper.py:/app/db_helper.py
      - ../auth_routes.py:/app/auth_routes.py
#      - ../cache.py:/app/cache.py


    depends_on:

      - redis
      - sqlserver

networks:
  frontend_network:
    external: true
  backend_network:
    external: true

volumes:
  sql_data: